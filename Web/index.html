<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <script src="./main.js"></script>
    <script src="./calculator.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Prueba de TypeScript con Node.js y ESNext</h1>
    <label for="input1">Ingrese un número 1:</label>
    <input type="number" id="input1" />
    <label for="input2">Ingrese un número 2:</label>
    <input type="number" id="input2" />
    <button id="btn">Calcular</button>
    <label for="result">Resultado:</label>
    <input type="text" id="result" readonly />
</body>
<script type="module">
    import { suma, resta, multiplicacion, division } from "./calculator.js";

    const input1 = document.getElementById("input1");
    const input2 = document.getElementById("input2");
    const btn = document.getElementById("btn");

    btn.addEventListener("click", () => {
        const num1 = parseFloat(input1.value);
        const num2 = parseFloat(input2.value);

        console.log(`Suma: ${suma(num1, num2)}`);
        console.log(`Resta: ${resta(num1, num2)}`);
        console.log(`Multiplicación: ${multiplicacion(num1, num2)}`);
        console.log(`División: ${division(num1, num2)}`);
    });
</script>
